services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vb
      POSTGRES_PASSWORD: vb
      POSTGRES_DB: verdictboard
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vb"]
      interval: 5s
      retries: 10
  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vb:vb@db:5432/verdictboard?schema=public
volumes:
  pgdata:
